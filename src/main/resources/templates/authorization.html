<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход | Naumen Onboarding</title>
    <style>
        :root {
            --naumen-orange: #FF6B00;
            --naumen-dark: #2D2D2D;
            --naumen-gray: #F5F5F5;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--naumen-gray);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: #ffffff;
            padding: 40px;
            border-radius: 20px; /* Сделал углы более скругленными как во втором примере */
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        /* Вынос логотипа в CSS */
        .logo-css {
            width: 100%;           /* Растягивается на всю ширину формы */
            max-width: 300px;      /* Но не шире 300px, чтобы не быть огромным */
            height: 100px;         /* Фиксированная высота для контейнера */
            background-image: url('/logoN.png');
            background-size: contain;    /* Картинка впишется целиком без обрезки */
            background-repeat: no-repeat;
            background-position: center;
            margin: 0 auto 20px;   /* Центрирование и отступ снизу */
        }

        h1 {
            font-size: 1.4rem;
            color: var(--naumen-dark);
            margin-bottom: 30px;
            font-weight: bold;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: #666;
            margin-left: 5px;
        }

        .input-group input {
            width: 100%;
            height: 55px; /* Увеличенная высота для удобства */
            padding: 0 20px;
            border: 2px solid #eee;
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.3s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--naumen-orange);
            background: #fffdfb;
        }

        .btn-login {
            width: 100%;
            height: 55px;
            background-color: var(--naumen-orange);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.3s;
            margin-top: 10px;
        }

        .btn-login:hover {
            background-color: #e66000;
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .footer-note {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #aaa;
        }

        .security-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #fcfcfc;
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid #f0f0f0;
        }
        .toast-container {
            position: fixed;
            top: 20px;
            right: -400px; /* Скрыто за экраном */
            background: white;
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.35);
            z-index: 9999;
            border-left: 5px solid var(--naumen-orange);
        }

        .toast-container.active {
            right: 20px;
        }

        .toast-content {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .toast-icon {
            background: var(--naumen-orange);
            color: white;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .toast-title {
            display: block;
            font-weight: bold;
            color: var(--naumen-dark);
        }

        .toast-desc {
            font-size: 0.85rem;
            color: #666;
        }

        .toast-progress {
            position: absolute;
            bottom: 0;
            left: 0;
            height: 3px;
            width: 100%;
            background: #eee;
        }

        .toast-progress::after {
            content: "";
            position: absolute;
            left: 0;
            height: 100%;
            width: 0%;
            background: var(--naumen-orange);
            transition: width 4s linear;
        }

        .toast-container.active .toast-progress::after {
            width: 100%;
        }
    </style>
</head>
<body>

<div class="login-container">
    <div class="logo-css"></div>

    <h1>Добро пожаловать!</h1>

    <form action="/login" method="POST">
        <div class="input-group">
            <label for="email">Корпоративный E-mail</label>
            <input type="email" id="email" name="email" placeholder="ivanov@naumen.ru" required>
        </div>

        <div class="input-group">
            <label for="password">Пароль</label>
            <input type="password" id="password" name="password" placeholder="••••••••" required>
        </div>

        <button type="submit" class="btn-login">Войти</button>
    </form>

    <div class="footer-note">
        <div class="security-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>Только для сотрудников Naumen</span>
        </div>
    </div>
</div>

<div id="toast" class="toast-container">
    <div class="toast-content">
        <span class="toast-icon">!</span>
        <div class="toast-message">
            <span class="toast-title">Ошибка входа</span>
            <span class="toast-desc">Неверные данные или техническая ошибка сервера.</span>
        </div>
    </div>
    <div class="toast-progress"></div>
</div>
<script>
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        // Если в URL есть параметр error=true
        if (urlParams.has('error')) {
            const toast = document.getElementById('toast');
            toast.classList.add('active');

            // Скрыть через 4 секунды
            setTimeout(() => {
                toast.classList.remove('active');
            }, 4000);
        }
    }
</script>
</body>
</html>
